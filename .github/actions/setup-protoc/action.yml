name: Set up protoc
description: Install a checksum-pinned Protocol Buffers compiler without a JavaScript action runtime

inputs:
  version:
    description: Protocol Buffers compiler version
    required: true
  sha256:
    description: SHA-256 checksum of the Linux x86-64 release archive
    required: true

runs:
  using: composite
  steps:
    - name: Download and install protoc
      shell: bash
      env:
        PROTOC_VERSION: ${{ inputs.version }}
        PROTOC_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail

        archive="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
        install_dir="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}"
        download_url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"

        curl --fail --location --retry 3 --output "${archive}" "${download_url}"
        echo "${PROTOC_SHA256}  ${archive}" | sha256sum --check
        unzip -q "${archive}" -d "${install_dir}"

        echo "${install_dir}/bin" >> "${GITHUB_PATH}"
        "${install_dir}/bin/protoc" --version
