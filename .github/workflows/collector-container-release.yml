name: Collector container release

on:
  push:
    tags:
      - '@mshamed1/node-flow@*'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: collector-container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/mshamed1/node-flow-collector

jobs:
  publish:
    name: Publish immutable multi-architecture image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#@mshamed1/node-flow@}"
          test "$version" != "$GITHUB_REF_NAME"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing version tag
        run: |
          if docker manifest inspect "${IMAGE_NAME}:${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag ${IMAGE_NAME}:${{ steps.version.outputs.value }}" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,format=long

      - name: Build and push linux/amd64 and linux/arm64
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.collector
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}

      - name: Attest the published manifest
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
