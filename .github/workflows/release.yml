name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use Go
        uses: actions/setup-go@v6
        with:
          go-version-file: runtime/go/go.mod
          cache-dependency-path: runtime/go/go.sum

      - name: Use Protocol Buffers compiler
        uses: ./.github/actions/setup-protoc
        with:
          version: '31.1'
          sha256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065

      - name: Install Go protocol generator
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10

      - name: Use supported npm and Yarn Classic
        run: |
          npm install --global npm@11
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          npm --version
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check
        continue-on-error: true

      - name: Build
        run: yarn build

      - name: Check generated protocol bindings
        run: yarn proto:check

      - name: Build Go collector
        run: yarn go:build

      - name: Vet Go collector
        run: yarn go:vet

      - name: Test Go collector
        run: yarn go:test

      - name: Race-test Go collector
        run: yarn go:race

      - name: Check npm scope migration
        run: yarn scope:check

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Inspect npm package payloads
        run: yarn package:check

      - name: Smoke-test packed packages
        run: yarn package:smoke

      - name: Start real-infrastructure integration lab
        run: yarn integration:up

      - name: Test real-infrastructure integrations
        run: yarn integration:test

      - name: Test durable sink outage and crash recovery
        run: yarn integration:durability

      - name: Stop real-infrastructure integration lab
        if: always()
        run: yarn integration:down

      - name: Create or update version pull request
        if: vars.NPM_TRUSTED_PUBLISHING_ENABLED != 'true'
        uses: changesets/action@v1
        with:
          version: yarn version-packages
          title: Release packages
          commit: Release packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version pull request or publish packages
        if: vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
        uses: changesets/action@v1
        with:
          version: yarn version-packages
          publish: yarn release
          title: Release packages
          commit: Release packages
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Leave this secret unset after first publication so npm uses trusted publishing again.
          NPM_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
