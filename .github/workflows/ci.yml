name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and smoke-test packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Use Go
        uses: actions/setup-go@v6
        with:
          go-version-file: runtime/go/go.mod
          cache-dependency-path: runtime/go/go.sum

      - name: Use Protocol Buffers compiler
        uses: ./.github/actions/setup-protoc
        with:
          version: '31.1'
          sha256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065

      - name: Install Go protocol generator
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10

      - name: Use Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check
        continue-on-error: true

      - name: Build
        run: yarn build

      - name: Check generated protocol bindings
        run: yarn proto:check

      - name: Build Go collector
        run: yarn go:build

      - name: Vet Go collector
        run: yarn go:vet

      - name: Test Go collector
        run: yarn go:test

      - name: Race-test Go collector
        run: yarn go:race

      - name: Check npm scope migration
        run: yarn scope:check

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Inspect npm package payloads
        run: yarn package:check

      - name: Smoke-test packed packages
        run: yarn package:smoke

  runtime-matrix:
    name: Runtime ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-arm64
            os: macos-15
          - target: darwin-x64
            os: macos-15-intel
          - target: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Use Go
        uses: actions/setup-go@v6
        with:
          go-version-file: runtime/go/go.mod
          cache-dependency-path: runtime/go/go.sum

      - name: Use Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build current platform runtime
        run: yarn runtime:build:current

      - name: Compile the launcher and its workspace dependencies
        run: |
          yarn workspace @mshamed1/node-flow-protocol build
          yarn workspace @mshamed1/node-flow-topology-engine build
          yarn workspace @mshamed1/node-flow-core build
          yarn workspace @mshamed1/node-flow-instrumentation-nestjs build
          yarn tsc -p cli/tsconfig.json

      - name: Verify launcher, dynamic port, health, and shutdown
        run: yarn runtime:smoke:launcher
