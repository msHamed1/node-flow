name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and smoke-test packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Use Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/collector/go.mod
          cache-dependency-path: services/collector/go.sum

      - name: Use Protocol Buffers compiler
        uses: arduino/setup-protoc@v3
        with:
          version: '31.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go protocol generator
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10

      - name: Use Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check
        continue-on-error: true

      - name: Build
        run: yarn build

      - name: Check generated protocol bindings
        run: yarn proto:check

      - name: Build Go collector
        run: yarn go:build

      - name: Vet Go collector
        run: yarn go:vet

      - name: Test Go collector
        run: yarn go:test

      - name: Race-test Go collector
        run: yarn go:race

      - name: Check npm scope migration
        run: yarn scope:check

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Inspect npm package payloads
        run: yarn package:check

      - name: Smoke-test packed packages
        run: yarn package:smoke
