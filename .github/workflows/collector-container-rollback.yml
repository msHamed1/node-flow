name: Verify collector container rollback

on:
  workflow_dispatch:
    inputs:
      current_image:
        description: Current collector image pinned by sha256 digest
        required: true
        type: string
      previous_image:
        description: Previous collector image pinned by sha256 digest
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    name: Verify state-compatible rollback
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable images
        env:
          CURRENT_IMAGE: ${{ inputs.current_image }}
          PREVIOUS_IMAGE: ${{ inputs.previous_image }}
        run: |
          docker pull "$CURRENT_IMAGE"
          docker pull "$PREVIOUS_IMAGE"

      - name: Start current image, then roll back on the same state volume
        env:
          CURRENT_IMAGE: ${{ inputs.current_image }}
          PREVIOUS_IMAGE: ${{ inputs.previous_image }}
        run: node scripts/verify-container-rollback.mjs "$CURRENT_IMAGE" "$PREVIOUS_IMAGE"
